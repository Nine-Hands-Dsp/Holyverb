name: Build Holyverb VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pas de version de Visual Studio imposée : CMake prend celle installée sur la machine GitHub
      - name: Configure (Visual Studio, x64)
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Holyverb-VST3-Windows
          path: build/Holyverb_artefacts/Release/VST3/Holyverb.vst3
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v4

      # Binaire universel : Mac Apple Silicon (M1, M2...) et Mac Intel
      - name: Configure (Xcode, universel arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build Release
        run: cmake --build build --config Release --parallel

      # Signature ad hoc (pas de compte développeur Apple nécessaire) + archive qui garde la structure du bundle
      - name: Sign and zip
        run: |
          cd build/Holyverb_artefacts/Release/VST3
          codesign --force --deep --sign - Holyverb.vst3
          codesign --verify --deep --verbose=2 Holyverb.vst3
          lipo -info Holyverb.vst3/Contents/MacOS/Holyverb
          ditto -c -k --keepParent Holyverb.vst3 "$GITHUB_WORKSPACE/Holyverb-VST3-macOS.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Holyverb-VST3-macOS
          path: Holyverb-VST3-macOS.zip
          if-no-files-found: error

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/Holyverb-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Holyverb-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: Holyverb-VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "Holyverb-VST3-Windows.zip" "Holyverb.vst3"
          pack dist/mac "Holyverb-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" Holyverb-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Holyverb-VST3-Windows.zip Holyverb-VST3-macOS.zip"
          [ -f Holyverb-Notice.pdf ] && FILES="$FILES Holyverb-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Holyverb $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
